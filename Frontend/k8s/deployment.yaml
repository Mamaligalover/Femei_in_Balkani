apiVersion: apps/v1
kind: Deployment
metadata:
  name: balkani-frontend
  namespace: default
  labels:
    app: balkani-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: balkani-frontend
  template:
    metadata:
      labels:
        app: balkani-frontend
        tier: frontend
    spec:
      containers:
      - name: balkani-frontend
        image: codbun/balkan:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
