<div class="max-w-7xl mx-auto p-6">
  <h1 class="text-4xl font-bold text-gray-800 mb-8">{{ title }}</h1>

  <div class="bg-gray-50 p-6 rounded-lg">
    <h2 class="text-2xl font-semibold text-gray-700 mb-6">Data from Backend API</h2>

    <div *ngIf="loading" class="text-gray-600">Loading data...</div>

    <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded-md border border-red-200 my-4">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error && data.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
      <div *ngFor="let item of data" class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow">
        <h3 class="text-xl font-semibold text-blue-600 mb-3">{{ item.name }}</h3>
        <p class="text-gray-600 mb-2">
          <strong class="text-gray-800">ID:</strong> {{ item.id }}
        </p>
        <p class="text-gray-600">
          <strong class="text-gray-800">Description:</strong> {{ item.description }}
        </p>
      </div>
    </div>

    <div *ngIf="!loading && !error && data.length === 0" class="text-gray-600">
      No data available
    </div>
  </div>

  <router-outlet />
</div>
