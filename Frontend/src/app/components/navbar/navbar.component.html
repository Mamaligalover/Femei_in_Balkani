<nav class="bg-gradient-to-r from-purple-600 to-pink-600 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center">
          <span class="text-white text-2xl font-bold">Balkan Women Connect</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-4">
        <a
          routerLink="/"
          routerLinkActive="bg-purple-700"
          [routerLinkActiveOptions]="{exact: true}"
          class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
          Home
        </a>
        <a
          routerLink="/profile"
          routerLinkActive="bg-purple-700"
          class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
          Profile
        </a>
        <a
          routerLink="/mentorship"
          routerLinkActive="bg-purple-700"
          class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
          Mentorship
        </a>
        <a
          routerLink="/events"
          routerLinkActive="bg-purple-700"
          class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
          Events
        </a>
        <a
          routerLink="/resources"
          routerLinkActive="bg-purple-700"
          class="text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-purple-700 transition">
          Resources
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button
          (click)="toggleMobileMenu()"
          class="text-white hover:bg-purple-700 p-2 rounded-md">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="mobileMenuOpen" class="md:hidden bg-purple-700">
    <div class="px-2 pt-2 pb-3 space-y-1">
      <a
        routerLink="/"
        routerLinkActive="bg-purple-800"
        [routerLinkActiveOptions]="{exact: true}"
        (click)="toggleMobileMenu()"
        class="text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-purple-800">
        Home
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="bg-purple-800"
        (click)="toggleMobileMenu()"
        class="text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-purple-800">
        Profile
      </a>
      <a
        routerLink="/mentorship"
        routerLinkActive="bg-purple-800"
        (click)="toggleMobileMenu()"
        class="text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-purple-800">
        Mentorship
      </a>
      <a
        routerLink="/events"
        routerLinkActive="bg-purple-800"
        (click)="toggleMobileMenu()"
        class="text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-purple-800">
        Events
      </a>
      <a
        routerLink="/resources"
        routerLinkActive="bg-purple-800"
        (click)="toggleMobileMenu()"
        class="text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-purple-800">
        Resources
      </a>
    </div>
  </div>
</nav>
