<nav class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center">
          <span class="text-gray-900 text-xl font-semibold">Balkan Women Connect</span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-1">
        <a
          routerLink="/"
          routerLinkActive="text-indigo-600"
          [routerLinkActiveOptions]="{exact: true}"
          class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium hover:text-indigo-600 transition">
          Home
        </a>
        <a
          routerLink="/profile"
          routerLinkActive="text-indigo-600"
          class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium hover:text-indigo-600 transition">
          Profile
        </a>
        <a
          routerLink="/onboarding"
          routerLinkActive="text-indigo-600"
          class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium hover:text-indigo-600 transition">
          Onboarding
        </a>
        <a
          routerLink="/mentorship"
          routerLinkActive="text-indigo-600"
          class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium hover:text-indigo-600 transition">
          Mentorship
        </a>
        <a
          routerLink="/events"
          routerLinkActive="text-indigo-600"
          class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium hover:text-indigo-600 transition">
          Events
        </a>
        <a
          routerLink="/resources"
          routerLinkActive="text-indigo-600"
          class="text-gray-600 px-3 py-2 rounded-md text-sm font-medium hover:text-indigo-600 transition">
          Resources
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button
          (click)="toggleMobileMenu()"
          class="text-gray-600 hover:text-gray-900 p-2 rounded-md">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="mobileMenuOpen" class="md:hidden bg-white border-t border-gray-200">
    <div class="px-2 pt-2 pb-3 space-y-1">
      <a
        routerLink="/"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        [routerLinkActiveOptions]="{exact: true}"
        (click)="toggleMobileMenu()"
        class="text-gray-600 block px-3 py-2 rounded-md text-base font-medium hover:text-indigo-600 hover:bg-indigo-50">
        Home
      </a>
      <a
        routerLink="/profile"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        (click)="toggleMobileMenu()"
        class="text-gray-600 block px-3 py-2 rounded-md text-base font-medium hover:text-indigo-600 hover:bg-indigo-50">
        Profile
      </a>
      <a
        routerLink="/onboarding"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        (click)="toggleMobileMenu()"
        class="text-gray-600 block px-3 py-2 rounded-md text-base font-medium hover:text-indigo-600 hover:bg-indigo-50">
        Onboarding
      </a>
      <a
        routerLink="/mentorship"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        (click)="toggleMobileMenu()"
        class="text-gray-600 block px-3 py-2 rounded-md text-base font-medium hover:text-indigo-600 hover:bg-indigo-50">
        Mentorship
      </a>
      <a
        routerLink="/events"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        (click)="toggleMobileMenu()"
        class="text-gray-600 block px-3 py-2 rounded-md text-base font-medium hover:text-indigo-600 hover:bg-indigo-50">
        Events
      </a>
      <a
        routerLink="/resources"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        (click)="toggleMobileMenu()"
        class="text-gray-600 block px-3 py-2 rounded-md text-base font-medium hover:text-indigo-600 hover:bg-indigo-50">
        Resources
      </a>
    </div>
  </div>
</nav>
